<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hessen Collection · Próximamente</title>
<meta name="description" content="The Hessen Collection — sitio en construcción. Muy pronto.">
<meta name="theme-color" content="#14211d">
<meta property="og:title" content="The Hessen Collection">
<meta property="og:description" content="Estamos construyendo algo especial. Muy pronto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14211d; --bg2:#0d1613; --gold:#c9a96e; --gold-soft:rgba(201,169,110,.35);
    --ink:#efe9dd; --muted:#a7b0aa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, var(--bg) 0%, var(--bg2) 75%);
    color:var(--ink); font-family:'Montserrat',system-ui,sans-serif; text-align:center;
    padding:48px 24px; overflow-x:hidden;
  }
  .frame{
    position:fixed; inset:16px; border:1px solid var(--gold-soft); pointer-events:none;
  }
  main{max-width:560px; width:100%; animation:fade 1.6s ease both}
  .eyebrow{
    font-size:11px; letter-spacing:.45em; text-transform:uppercase; color:var(--gold); margin-bottom:14px;
  }
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(40px,11vw,68px);
    line-height:1.02; letter-spacing:.02em;
  }
  h1 em{font-style:italic; color:var(--gold)}
  .rule{width:64px; height:1px; background:var(--gold); margin:30px auto}
  h2{
    font-size:13px; font-weight:500; letter-spacing:.3em; text-transform:uppercase; margin-bottom:14px;
  }
  p{font-size:15px; line-height:1.7; color:var(--muted); font-weight:300; max-width:420px; margin:0 auto}
  .progress{
    margin:36px auto 0; width:180px; height:1px; background:var(--gold-soft); position:relative; overflow:hidden;
  }
  .progress::after{
    content:""; position:absolute; top:0; left:-40%; width:40%; height:100%; background:var(--gold);
    animation:slide 2.4s ease-in-out infinite;
  }
  footer{
    margin-top:56px; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); opacity:.7;
  }
  @keyframes slide{to{left:100%}}
  @keyframes fade{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){main,.progress::after{animation:none}}
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <main>
    <div class="eyebrow">Próximamente</div>
    <h1>The Hessen<br><em>Collection</em></h1>
    <div class="rule"></div>
    <h2>Sitio en construcción</h2>
    <p>Estamos preparando algo especial para usted. Muy pronto podrá conocer todos los detalles aquí.</p>
    <div class="progress" aria-hidden="true"></div>
    <footer>Un proyecto de IMPULSA · Guatemala</footer>
  </main>
</body>
</html>
